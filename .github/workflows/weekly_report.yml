name: Weekly Stock Report

on:
  schedule:
    - cron: "0 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Add Russian Trusted CA (T-Bank API certs)
        run: |
          curl -s -o root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -s -o sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          CERTIFI=$(python -c "import certifi; print(certifi.where())")
          cat root_ca.crt sub_ca.crt >> "$CERTIFI"
          echo "Добавлено в $CERTIFI"

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
        run: |
          set -o pipefail
          python bot.py 2>&1 | tee /tmp/bot_out.log

      - name: Surface error (annotation)
        if: failure()
        run: |
          ERR=$(tail -c 700 /tmp/bot_out.log | tr '\n' ' | ')
          echo "::error::BOT OUTPUT TAIL: $ERR"

      - name: Keepalive (prevent 60-day auto-disable)
        if: always()
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/weekly_report.yml/enable"
